name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.75.0
          manifest-path: pyproject.toml
          locked: true
      - run: pixi run check
      - run: pixi run test
      - run: pixi run uv build
      - run: pixi run benchmark
      - uses: actions/upload-artifact@v7
        with:
          name: validation-${{ matrix.os }}
          path: |
            dist/
            .cache/benchmark.json
          include-hidden-files: true

  gallery:
    name: GPU and ray gallery
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.75.0
          manifest-path: pyproject.toml
          locked: true
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0
      - name: Cache reference Blender runtime
        id: blender
        uses: actions/cache@v6.1.0
        with:
          path: .cache/blender-4.5.2-linux-x64
          key: blender-4.5.2-linux-x64-bba53619
      - name: Install reference Blender runtime
        if: steps.blender.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .cache
          cd .cache
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.2-linux-x64.tar.xz --output blender.tar.xz
          echo 'bba5361929491ccd69374b93c547f087f09c9eaac5d8cc96da3210485c13d44f  blender.tar.xz' | sha256sum --check
          tar -xf blender.tar.xz
          rm blender.tar.xz
      - name: Use reference Blender runtime
        run: echo "$PWD/.cache/blender-4.5.2-linux-x64" >> "$GITHUB_PATH"
      - name: Render actual PyMOL views
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p .cache
          xvfb-run -a pixi run gallery --fetch 2>&1 | tee .cache/gallery-render.log
      - name: Validate shader sessions and native ray commands
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a pixi run uv run --no-project --python .pixi/envs/default/bin/python python scripts/validate_gpu.py 2>&1 | tee .cache/gpu-validation.log
      - name: Validate Cycles refraction and subsurface scattering
        shell: bash
        run: pixi run uv run --no-project --python .pixi/envs/default/bin/python python scripts/validate_cycles.py --output .cache/gallery/optics --samples 32 2>&1 | tee .cache/cycles-validation.log
      - name: Report render diagnostics
        if: failure()
        run: |
          pixi run uv run --no-project --python .pixi/envs/default/bin/python python - <<'PY'
          from pathlib import Path
          for name in ("gallery-render", "gpu-validation", "cycles-validation"):
              path = Path(".cache") / f"{name}.log"
              if path.is_file():
                  text = path.read_text(errors="replace")[-12000:]
                  text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title={name}::{text}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: pymol-gallery
          path: .cache/gallery/
          include-hidden-files: true
          compression-level: 0
      - name: Check out publication workspace
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          path: .cache/publication
          persist-credentials: true
      - name: Publish generated gallery branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bash scripts/publish_gallery.sh .cache/gallery .cache/publication
